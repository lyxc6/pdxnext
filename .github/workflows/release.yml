name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build installer and publish release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Use nuget.org for this CI run
        shell: pwsh
        run: |
          @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          '@ | Set-Content -Path NuGet.config -Encoding utf8

      - name: Install Inno Setup 7.1.1
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-7.1.1-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-"
          ) -Wait

          $candidates = @(
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            throw "ISCC.exe not found after Inno Setup installation"
          }
          "INNO_SETUP_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Check tag matches version.props
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          [xml]$props = Get-Content -LiteralPath version.props
          $version = [string]$props.Project.PropertyGroup.Version
          $expected = "v$version"
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "Tag ${{ github.ref_name }} does not match version.props ($expected)"
          }
          "Version=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build, self-check and publish payload
        run: .\publish.cmd

      - name: Build installer and update manifest
        run: python tools\build-installer.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdxnext-installer
          path: |
            dist/installer/PdxNext-Setup-*.exe
            dist/installer/update.json
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/PdxNext-Setup-*.exe
            dist/installer/update.json
          generate_release_notes: true
          fail_on_unmatched_files: true
