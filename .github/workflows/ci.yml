name: CI

on:
  push:
    branches:
      - main
      - "ver/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and self-check
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version branch is active
        if: github.ref_type == 'branch' && startsWith(github.ref_name, 'ver/')
        shell: pwsh
        run: |
          git fetch origin main --depth=1
          $registryText = (git show origin/main:integration-branch) -join "`n"
          $active = $registryText -split "`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ -and -not $_.StartsWith('#') }
          if ($env:GITHUB_REF_NAME -notin $active) {
            throw "Branch $env:GITHUB_REF_NAME is frozen or not registered in main's integration-branch"
          }

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Use nuget.org for this CI run
        shell: pwsh
        run: |
          @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          '@ | Set-Content -Path NuGet.config -Encoding utf8

      - name: Restore, build and self-check
        run: |
          dotnet build PdxLauncher.sln -c Release -m:1
          dotnet tests\PdxLauncher.Checks\bin\Release\net10.0\PdxLauncher.Checks.dll
